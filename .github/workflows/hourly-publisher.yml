name: Hourly AI Publisher
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      scheduler:
        description: "Origin of authenticated external cron (manual or cloudflare)"
        required: false
        type: string
      scheduled_hour_utc:
        description: "Original UTC hour of external cron delivery"
        required: false
        type: string
  pull_request:
    paths:
      - content.json
      - covers/**
      - scripts/hourly-publish.mjs
      - scripts/hourly-publish.test.mjs
      - scripts/public-site-verify.mjs
      - scripts/public-site-verify.test.mjs
      - scripts/workflow-publish-gate.test.mjs
      - scripts/editorial-cover-integrity.test.mjs
      - scripts/editorial-source-diversity.test.mjs
      - scripts/editorial-structure.test.mjs
      - scripts/reviewer-evidence-prompt.test.mjs
      - scripts/provider-transport-diagnostic.test.mjs
      - scripts/cloudflare-scheduled-kpi.test.mjs
      - scripts/scheduled-origin-receipt.mjs
      - scripts/scheduled-origin-receipt.test.mjs
      - infra/cloudflare-news-trigger/**
      - .github/workflows/hourly-publisher.yml
permissions:
  contents: read
concurrency:
  group: hourly-ai-publisher-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Publisher non-secret provider metadata presence
        env:
          AI_URL_SET: ${{ vars.AI_CHAT_COMPLETIONS_URL != '' }}
          WRITER_MODEL_SET: ${{ vars.WRITER_MODEL != '' }}
          REVIEWER_MODEL_SET: ${{ vars.REVIEWER_MODEL != '' }}
        run: |
          echo "AI_CHAT_COMPLETIONS_URL_PRESENT=$AI_URL_SET"
          echo "WRITER_MODEL_PRESENT=$WRITER_MODEL_SET"
          echo "REVIEWER_MODEL_PRESENT=$REVIEWER_MODEL_SET"
          echo "AI_API_KEY_PRESENT=NOT_CHECKED_SECRET_READ_FORBIDDEN"
      - name: Publisher fail-closed and public-site guard tests
        run: node --test scripts/hourly-publish.test.mjs scripts/public-site-verify.test.mjs scripts/workflow-publish-gate.test.mjs scripts/editorial-cover-integrity.test.mjs scripts/editorial-source-diversity.test.mjs scripts/editorial-structure.test.mjs scripts/reviewer-evidence-prompt.test.mjs scripts/cloudflare-scheduled-kpi.test.mjs scripts/scheduled-origin-receipt.test.mjs scripts/provider-transport-diagnostic.test.mjs infra/cloudflare-news-trigger/cron.test.mjs
      - name: Public article and cover HTTP verification (read only)
        if: github.event_name == 'pull_request'
        run: node scripts/public-site-verify.mjs
  publish:
    if: github.event_name != 'pull_request'
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Record sanitized GitHub dispatch metadata (not Cloudflare proof)
        env:
          NEWS_SCHEDULER_ORIGIN: ${{ inputs.scheduler }}
          NEWS_SCHEDULED_HOUR_UTC: ${{ inputs.scheduled_hour_utc }}
        run: node scripts/scheduled-origin-receipt.mjs
      - name: Generate, independently review, and prepare article
        env:
          NEWS_REPORTING_MODE: official-announcement
          NEWS_HOURLY_PUBLISH_LIMIT: "true"
          NEWS_SCHEDULER_ORIGIN: ${{ inputs.scheduler }}
          AI_CHAT_COMPLETIONS_URL: ${{ vars.AI_CHAT_COMPLETIONS_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          WRITER_MODEL: ${{ vars.WRITER_MODEL }}
          REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL }}
        run: node scripts/hourly-publish.mjs
      - name: Commit article and original cover
        id: publication
        run: |
          git add -- content.json covers/
          if git diff --cached --quiet; then
            echo "NOOP_NO_QUALIFIED_NEW_STORY"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "tigeriq-media-bot"
          git config user.email "tigeriq-media-bot@users.noreply.github.com"
          git commit -m "publish: verified trilingual AI story and cover"
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Verify live article and original cover without AI provider calls
        if: steps.publication.outputs.published == 'true'
        run: node scripts/public-site-verify.mjs
